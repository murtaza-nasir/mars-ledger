# Typecheck and test every push and pull request. On a version tag (v1.2.3) also build and push both images to
# GitHub's container registry: ghcr.io/murtaza-nasir/mars-ledger (the app) and ghcr.io/murtaza-nasir/mars-ledger-engine (the
# open-source engine, unmodified, at ENGINE_COMMIT).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Fetch the card and board data from the engine at ENGINE_COMMIT
        run: npm run fetch-data
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Names and pins
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          commit="$(tr -d '[:space:]' < ENGINE_COMMIT)"
          {
            echo "app=ghcr.io/${owner}/mars-ledger"
            echo "engine=ghcr.io/${owner}/mars-ledger-engine"
            echo "commit=${commit}"
            echo "short=${commit:0:12}"
            echo "sha=${GITHUB_SHA:0:8}"
            echo "version=${GITHUB_REF_NAME#v}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: App image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_SHA=${{ steps.meta.outputs.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.meta.outputs.app }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.app }}:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Engine image (upstream source at ENGINE_COMMIT, upstream Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/terraforming-mars/terraforming-mars.git#${{ steps.meta.outputs.commit }}
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.title=Terraforming Mars engine (for Mars Ledger)
            org.opencontainers.image.source=https://github.com/terraforming-mars/terraforming-mars
            org.opencontainers.image.revision=${{ steps.meta.outputs.commit }}
            org.opencontainers.image.licenses=GPL-3.0
          tags: ${{ steps.meta.outputs.engine }}:${{ steps.meta.outputs.short }}
          cache-from: type=gha,scope=engine
          cache-to: type=gha,mode=max,scope=engine
